<!DOCTYPE html>
<html lang="en" data-theme="midnight" data-font="serif">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frosted Midnight · Christmas Gift Tracker (Free Demo)</title>
<style>
/* ============ FROSTED MIDNIGHT IDENTITY · THEMES ============ */
:root{
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --topbar-h:64px;
}
/* Frosted Midnight — light default: deep navy + silver */
[data-theme="midnight"]{
  --bg:#F5F7FA; --bg-soft:#E9EEF5; --card:#FFFFFF; --card-soft:#F8FAFD;
  --ink:#1B2B44; --ink-soft:#55677F; --ink-faint:#8FA0B5;
  --line:#D6DEE9; --line-soft:#E4EAF2;
  --accent:#23456E; --accent-deep:#16294A; --accent-soft:#DCE6F2; --accent-ghost:#EAF0F8;
  --gold:#9AA9BC; --gold-deep:#6E7F95; --gold-soft:#E9EEF5; --gold-ghost:#F2F5F9;
  --good:#4E8F5E; --good-soft:#DCEEDD; --warn:#B98A1F; --warn-soft:#F7ECD2; --bad:#C05B5B; --bad-soft:#F7DEDE;
  --input-bg:#F8FAFD; --shadow-color:27,43,68;
}
/* Sugar Plum — light: plum + rose */
[data-theme="plum"]{
  --bg:#FAF4F7; --bg-soft:#F3E4EC; --card:#FFFFFF; --card-soft:#FDF8FA;
  --ink:#46223A; --ink-soft:#7C5568; --ink-faint:#A98CA0;
  --line:#E7CFD9; --line-soft:#F0DCE4;
  --accent:#7A2E52; --accent-deep:#5A1F3D; --accent-soft:#F2DAE4; --accent-ghost:#F9ECF1;
  --gold:#B76E8B; --gold-deep:#8F4F66; --gold-soft:#F6E3EA; --gold-ghost:#FBF0F4;
  --good:#4E8F5E; --good-soft:#DCEEDD; --warn:#B98A1F; --warn-soft:#F7ECD2; --bad:#C05B5B; --bad-soft:#F7DEDE;
  --input-bg:#FDF8FA; --shadow-color:70,34,58;
}
/* Arctic Glow — light cool: ice blue + silver */
[data-theme="arctic"]{
  --bg:#F2F8FB; --bg-soft:#E2EFF6; --card:#FFFFFF; --card-soft:#F7FBFE;
  --ink:#1E3A4C; --ink-soft:#56707F; --ink-faint:#8AA2B0;
  --line:#CFDEE8; --line-soft:#DFEAF2;
  --accent:#2E6E8E; --accent-deep:#1E4E68; --accent-soft:#D8EAF3; --accent-ghost:#EAF3F9;
  --gold:#8FA9BC; --gold-deep:#647E92; --gold-soft:#E6EEF4; --gold-ghost:#F1F5F9;
  --good:#4E8F5E; --good-soft:#DCEEDD; --warn:#B98A1F; --warn-soft:#F7ECD2; --bad:#C05B5B; --bad-soft:#F7DEDE;
  --input-bg:#F7FBFE; --shadow-color:30,58,76;
}
/* Starlit Night — dark */
[data-theme="starlit"]{
  --bg:#0E1522; --bg-soft:#141D2E; --card:#19243A; --card-soft:#1F2C44;
  --ink:#EDF1F7; --ink-soft:#A9B7CC; --ink-faint:#6E7E95;
  --line:#2A3A55; --line-soft:#22304A;
  --accent:#8FA9CC; --accent-deep:#B4C6DE; --accent-soft:#24344F; --accent-ghost:#1D2A42;
  --gold:#C2CFE2; --gold-deep:#DCE4F0; --gold-soft:#2C3A52; --gold-ghost:#253349;
  --good:#8FC79B; --good-soft:#2C4633; --warn:#D9A94F; --warn-soft:#4A3A1E; --bad:#DE8484; --bad-soft:#4E2A2A;
  --input-bg:#141D2E; --shadow-color:0,0,0;
}
/* ============ FONTS ============ */
[data-font="serif"]{ --font-body:Georgia,'Times New Roman',serif; --font-display:Georgia,'Times New Roman',serif; }
[data-font="sans"]{ --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; --font-display:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
[data-font="elegant"]{ --font-body:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif; --font-display:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif; }
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--ink);
  min-height:100vh; transition:background .35s ease,color .35s ease;
  padding-top:var(--topbar-h);
}
::selection{background:var(--gold-soft)}
h1,h2,h3,.display{font-family:var(--font-display);letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:var(--input-bg);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label{font-size:13px;font-weight:600;color:var(--ink-soft);display:block;margin:0 0 6px}
/* ============ TOPBAR ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:100;
  display:flex;align-items:center;gap:14px;padding:0 20px;
  background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
[data-theme="starlit"] .topbar{background:rgba(20,29,46,.88)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;font-size:19px;
  box-shadow:0 1px 2px rgba(27,43,68,.06),0 10px 28px -8px rgba(27,43,68,.14)}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:17px;white-space:nowrap}
.brand-name small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase}
.topbar-spacer{flex:1}
.theme-dots{display:flex;gap:8px;align-items:center}
.theme-dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;transition:transform .18s}
.theme-dot:hover{transform:scale(1.12)}
.theme-dot.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.theme-dot[data-set-theme="midnight"]{background:linear-gradient(135deg,#23456E 50%,#C9D4E2 50%)}
.theme-dot[data-set-theme="plum"]{background:linear-gradient(135deg,#7A2E52 50%,#E9B8C9 50%)}
.theme-dot[data-set-theme="arctic"]{background:linear-gradient(135deg,#2E6E8E 50%,#E8F4FA 50%)}
.theme-dot[data-set-theme="starlit"]{background:linear-gradient(135deg,#0E1522 50%,#8FA9CC 50%)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  display:grid;place-items:center;font-size:17px;color:var(--ink-soft);transition:all .2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent-deep);transform:translateY(-1px)}
.font-picker{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.font-picker button{border:none;background:transparent;padding:8px 11px;font-size:14px;color:var(--ink-faint)}
.font-picker button.active{background:var(--accent-soft);color:var(--accent-deep)}
.font-picker button[data-set-font="serif"]{font-family:Georgia,serif}
.font-picker button[data-set-font="sans"]{font-family:-apple-system,sans-serif}
.font-picker button[data-set-font="elegant"]{font-family:'Palatino Linotype',serif;font-style:italic}
/* ============ NAV TABS ============ */
.navtabs{position:sticky;top:var(--topbar-h);z-index:90;background:rgba(245,247,250,.92);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);
  display:flex;gap:4px;padding:10px 20px;overflow-x:auto}
[data-theme="starlit"] .navtabs{background:rgba(14,21,34,.92)}
.navtab{border:none;background:transparent;padding:10px 16px;border-radius:var(--r-sm);font-size:14.5px;font-weight:600;
  color:var(--ink-soft);white-space:nowrap;transition:all .2s;border-bottom:2px solid transparent}
.navtab:hover{color:var(--ink);background:var(--card-soft)}
.navtab.active{color:var(--accent-deep);background:var(--accent-soft);border-bottom-color:var(--accent)}
/* ============ LAYOUT ============ */
.wrap{max-width:1120px;margin:0 auto;padding:26px 20px 90px}
.view{display:none;animation:fadeUp .4s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-title{font-size:30px;margin:6px 0 4px}
.page-sub{color:var(--ink-soft);font-size:15.5px;margin-bottom:22px}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid.c4{grid-template-columns:repeat(2,1fr)}.grid.c3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:20px;
  box-shadow:0 1px 2px rgba(27,43,68,.06),0 10px 28px -8px rgba(27,43,68,.10)}
.card h3{font-size:16.5px;margin-bottom:12px}
.stat-num{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.1}
.stat-lab{font-size:13px;color:var(--ink-soft);margin-top:4px}
.stat-sub{font-size:12.5px;color:var(--ink-faint);margin-top:2px}
.prog{height:10px;border-radius:99px;background:var(--bg-soft);overflow:hidden;margin-top:10px}
.prog>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-deep));transition:width .5s ease}
.prog.gold>div{background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--r-sm);
  padding:11px 18px;font-size:14.5px;font-weight:700;transition:all .2s;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;
  box-shadow:0 1px 2px rgba(27,43,68,.06),0 10px 28px -8px rgba(27,43,68,.14)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(27,43,68,.09),0 18px 44px -12px rgba(27,43,68,.22)}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-deep)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);
  padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--card-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;white-space:nowrap}
.pill.idea{background:var(--gold-soft);color:var(--gold-deep)}
.pill.purchased{background:var(--accent-soft);color:var(--accent-deep)}
.pill.wrapped{background:#E3EAF6;color:#23456E}
.pill.delivered{background:var(--good-soft);color:var(--good)}
.pill.shipped{background:var(--warn-soft);color:var(--warn)}
.pill.intransit{background:var(--accent-soft);color:var(--accent-deep)}
.pill.out{background:var(--warn-soft);color:var(--warn)}
.row-actions{display:flex;gap:6px}
.mini-btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 9px;font-size:12.5px;color:var(--ink-soft)}
.mini-btn:hover{border-color:var(--accent);color:var(--accent-deep)}
.mini-btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.empty{padding:34px 20px;text-align:center;color:var(--ink-faint);font-size:14.5px}
.empty .big{font-size:34px;margin-bottom:8px}
/* modal */
.modal-back{position:fixed;inset:0;background:rgba(20,30,48,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:18px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal-back.open{display:flex;animation:fadeUp .25s ease}
.modal{background:var(--card);border-radius:var(--r-lg);width:100%;max-width:520px;max-height:90vh;overflow:auto;
  padding:24px;box-shadow:0 2px 6px rgba(27,43,68,.09),0 18px 44px -12px rgba(27,43,68,.22)}
.modal h3{font-size:20px;margin-bottom:4px}
.modal .msub{color:var(--ink-soft);font-size:14px;margin-bottom:18px}
.field{margin-bottom:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent-deep);color:#fff;
  padding:12px 22px;border-radius:99px;font-size:14px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:all .3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* countdown */
.cd-row{display:flex;gap:10px;margin-top:12px}
.cd-cell{flex:1;background:var(--card-soft);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:12px 6px;text-align:center}
.cd-num{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--accent-deep)}
.cd-lab{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
/* bars */
.bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.bar-row .blab{width:130px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft)}
.bar-track{flex:1;height:9px;border-radius:99px;background:var(--bg-soft);position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-deep))}
.bar-val{width:76px;flex:none;text-align:right;font-weight:700;font-size:13.5px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
.section-head h2{font-size:21px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.searchbar{max-width:280px}
footer.app-foot{text-align:center;color:var(--ink-faint);font-size:12.5px;padding:34px 0 10px}
@media(max-width:640px){.brand-name{display:none}.font-picker{display:none}}
</style>
</head>

const recName=id=>(S.recipients.find(r=>r.id===id)||{name:"—"}).name;
const recOf=g=>S.recipients.find(r=>r.id===g.recipientId)||{};
const spentTotal=()=>S.gifts.filter(g=>g.status!=="idea").reduce((a,g)=>a+(+g.price||0),0);
const countBy=st=>S.gifts.filter(g=>g.status===st).length;
function personSpent(rid){return S.gifts.filter(g=>g.recipientId===rid&&g.status!=="idea").reduce((a,g)=>a+(+g.price||0),0);}
function personBudget(rid){const r=S.recipients.find(x=>x.id===rid);return r?+r.budget||0:0;}
function countdown(){const now=new Date();let x=new Date(now.getFullYear(),11,25);
  if(now>x)x=new Date(now.getFullYear()+1,11,25);
  const d=x-now;return{d:Math.floor(d/864e5),h:Math.floor(d/36e5)%24,m:Math.floor(d/6e4)%60};}

function nextUpHtml(){

  S.gifts.filter(g=>g.status==="purchased"&&!g.wrapPaper).slice(0,2).forEach(g=>items.push(`Wrap <b>${esc(g.name)}</b> for ${esc(recName(g.recipientId))}`));

<script>
"use strict";
/* ================= GLOBAL EVENT DELEGATION ================= */
document.addEventListener("click",e=>{
  const t=e.target;
  const goto=t.closest("[data-goto]"); if(goto){switchView(goto.dataset.goto);window.scrollTo({top:0,behavior:"smooth"});return;}
  if(t.closest("[data-add-gift]")){giftModal();return;}
  if(t.closest("[data-add-person]")){personModal();return;}
  if(t.closest("[data-add-wrap]")){wrapModal();return;}
  const eg=t.closest("[data-edit-gift]"); if(eg){giftModal(eg.dataset.editGift);return;}
  const dg=t.closest("[data-del-gift]"); if(dg){const g=S.gifts.find(x=>x.id===dg.dataset.delGift);
    if(g&&confirm(`Delete "${g.name}"?`)){S.gifts=S.gifts.filter(x=>x.id!==g.id);persist();render();toast("Gift deleted");}return;}
  const ep=t.closest("[data-edit-person]"); if(ep){personModal(ep.dataset.editPerson);return;}
  const dp=t.closest("[data-del-person]"); if(dp){const r=S.recipients.find(x=>x.id===dp.dataset.delPerson);
    if(r&&confirm(`Remove ${r.name}? Their gifts stay but become unassigned.`)){
      S.recipients=S.recipients.filter(x=>x.id!==r.id);
      S.gifts.forEach(g=>{if(g.recipientId===r.id)g.recipientId="";});
      persist();render();toast("Recipient removed");}return;}
  const wm=t.closest("[data-wrap-minus]"); if(wm){const w=S.wrap.find(x=>x.id===wm.dataset.wrapMinus);
    if(w){w.qty=Math.max(0,w.qty-1);persist();render();}return;}
  const wp=t.closest("[data-wrap-plus]"); if(wp){const w=S.wrap.find(x=>x.id===wp.dataset.wrapPlus);
    if(w){w.qty++;persist();render();}return;}
  const wd=t.closest("[data-wrap-del]"); if(wd){
    if(confirm("Remove this wrapping paper?")){S.wrap=S.wrap.filter(x=>x.id!==wd.dataset.wrapDel);persist();render();toast("Removed");}return;}
});

  </div>

}

<!-- ===== LEDGERLOOPSTUDIO DEMO ENTRY LIMIT (10) ===== -->
<script>
(function(){
  var DEMO_LIMIT = 10;
  var DEMO_MSG = "Demo limit reached (10 entries). Get the full version on Etsy for unlimited entries!";
  var demoArrays = new WeakSet();
  var initialLens = new WeakMap();

  function registerDB(){
    try {
      var db = (typeof DB !== 'undefined' && DB) ? DB : null;
      if (!db || typeof db !== 'object') return;
      Object.keys(db).forEach(function(k){
        try {
          var v = db[k];
          if (Array.isArray(v) && !demoArrays.has(v)) {
            demoArrays.add(v);
            initialLens.set(v, v.length);
          }
        } catch(e){}
      });
    } catch(e){}
  }

  function checkLimit(arr, addCount){
    if (!demoArrays.has(arr)) return true;
    var initial = initialLens.get(arr) || 0;
    var userAdded = arr.length - initial;
    if (userAdded + addCount > DEMO_LIMIT) {
      try {
        if (typeof toast === 'function') toast(DEMO_MSG);
        else alert(DEMO_MSG);
      } catch(e){ alert(DEMO_MSG); }
      return false;
    }
    return true;
  }

  var _push = Array.prototype.push;
  Array.prototype.push = function(){
    if (demoArrays.has(this) && !checkLimit(this, arguments.length)) return this.length;
    return _push.apply(this, arguments);
  };
  var _unshift = Array.prototype.unshift;
  Array.prototype.unshift = function(){
    if (demoArrays.has(this) && !checkLimit(this, arguments.length)) return this.length;
    return _unshift.apply(this, arguments);
  };
  var _splice = Array.prototype.splice;
  Array.prototype.splice = function(start, deleteCount){
    var items = Array.prototype.slice.call(arguments, 2);
    if (demoArrays.has(this) && items.length && !checkLimit(this, items.length)) return [];
    return _splice.apply(this, arguments);
  };

  function boot(){
    registerDB();
    // Re-register periodically to catch DB reassignments (reset/load)
    setInterval(registerDB, 2500);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(boot, 400); });
  } else {
    setTimeout(boot, 400);
  }
})();
</script>
